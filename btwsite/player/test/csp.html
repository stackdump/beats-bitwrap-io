<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- what a Claude artifact page allows (project-datum 6669), plus 'wasm-unsafe-eval', without which no WebAssembly runs:
     scripts inline, from this page's own files or a CDN; fetches to this page's origin only; nothing else -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' cdn.jsdelivr.net unpkg.com; connect-src 'self'">
<title>beatscript-track under an artifact CSP</title>
<script>
  // every blocked request or script, for the test (and for a person: the count is printed below)
  window.__violations = [];
  document.addEventListener('securitypolicyviolation', function (e) {
    window.__violations.push({ directive: e.violatedDirective, blocked: e.blockedURI, sample: e.sample });
    var n = document.getElementById('violations');
    if (n) n.textContent = window.__violations.length + ' blocked: ' + window.__violations.map(function (v) { return v.directive + ' ' + v.blocked; }).join(', ');
  });
</script>
<script type="module" src="../beatscript-track.js"></script>
</head>
<body>
<h1>beatscript-track</h1>
<p>Drums on an 808 kit, a melody and a sung line, played by the bundled engine. Press play.</p>
<beatscript-track id="track">
  <script type="text/beatscript">
#! name: artifact test: drums, an 808 kit and a sung line
tempo 120
key am
let four = x ~ ~ ~ x ~ ~ ~ x ~ ~ ~ x ~ ~ ~
let backs = ~ ~ ~ ~ x ~ ~ ~ ~ ~ ~ ~ x ~ ~ ~
let offs = ~ ~ x ~ ~ ~ x ~ ~ ~ x ~ ~ ~ x ~
section verse 4 bars {
  deck A: kick four kit=drums-808 | snare backs | hihat offs
  deck B: melody a4 ~ c5 ~ e5 ~ c5 ~ a4 ~ g4 ~ a4 ~ ~ ~
  deck B: sing "hold the night, hold it near" on melody
}
arrange verse
  </script>
</beatscript-track>
<p id="violations">0 blocked</p>
</body>
</html>
