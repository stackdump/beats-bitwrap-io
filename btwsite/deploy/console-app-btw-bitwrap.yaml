# Draft manifest for the console MCP server (stackdump-com/apps/btw-bitwrap.yaml). NOT registered: the console tools were
# denied in the unattended run (and valoper was unreachable), so btw.bitwrap.io was deployed by hand with
# btwsite/deploy/deploy.sh, following the same conventions as windwheel-bitwrap. Register it, then run app_drift to compare.
#
# CAUTION: app_deploy runs `git pull --ff-only origin main && make build`, and this service runs from the feature branch
# feat/btw-site in its own checkout (~/Workspace/btw-bitwrap-io), built with `go build ./cmd/btwsite`, with artifacts built from
# the PRIVATE djrust-vevr-se (btwd, wasm) copied in by deploy.sh. Do not app_deploy it until the branch is merged to main
# and the Makefile's default `build` target builds ./cmd/btwsite; until then deploy with btwsite/deploy/deploy.sh.
name: btw-bitwrap
title: 'btw — the bitwrap music language, code-first: editor with live firing markers, Gemini Flash compose (signed in), streaming Rust render, MCP; public at beatscript.app (btw.bitwrap.io redirects)'
repo: stackdump/beats-bitwrap-io
dir: btw-bitwrap-io
host: pflow.dev
port: 18097
service: btw-bitwrap
cmd: ./btw-bitwrap-io -addr 127.0.0.1:18097 -btwd ./btwsite/bin/btwd -web btwsite/web -examples btwsite/examples -docs btwsite/web/docs -data ./data -public-url https://beatscript.app -legacy-hosts btw.bitwrap.io -android-beta-url https://play.google.com/apps/testing/app.beatscript
vhost: btw.bitwrap.io
# beatscript.app (+ www) is a second vhost+cert for the same process (nginx/beatscript.app.conf, deploy.sh *-beatscript steps).
# The console manifest models one vhost per app, so it is recorded here and in notes, not as a second vhost: keep it out of
# app_drift's reach (do not app_expose/app_certify beatscript.app against this manifest).
urls:
- https://beatscript.app/
- https://beatscript.app/mcp
- https://beatscript.app/llms.txt
marking:
  registered: 1
  vhost: 1
  cert: 1
  live: 1
audience: external
notes: 'Also served as beatscript.app (apex only, no www; same backend, own cert). Since 2026-11-19 beatscript.app is the public origin; btw.bitwrap.io 301s pages there and keeps /api/, /mcp, /context/ proxied (nginx/btw.bitwrap.io.redirect.conf), and -legacy-hosts keeps phones paired under it verifying. Deployed 2026-11-18 from branch feat/btw-site (public repo, MIT). Env in ~/.env-services/btw-bitwrap (0600): GEMINI_API_KEY (copied on the host from the pflow-xyz env, shared quota), BTW_ADMIN_TOKEN, BTW_SESSION_SECRET. Kill switch: touch ~/Workspace/btw-bitwrap-io/data/compose.off. /api/admin/ is closed at nginx.'
