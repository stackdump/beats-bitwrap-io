# btw.bitwrap.io after the move to beatscript.app (the public origin since 2026-11-19).
# Pages, links, cards and docs: 301 to the same path on beatscript.app. Kept proxied to the same backend
# (127.0.0.1:18097), NOT redirected, because clients that cannot follow a redirect use them:
#   /api/   paired phones (BtwDevice requests sign the host btw.bitwrap.io; the app lists it in -legacy-hosts and the
#           phone does not follow redirects), the beats.bitwrap.io /p page's store fetch, compose/render clients
#   /mcp    MCP clients configured with https://btw.bitwrap.io/mcp (a POST is not re-sent across a 301)
#   /context/  the published JSON-LD @context URL
# Port 80: ACME + redirect, as before.
server {
    server_name btw.bitwrap.io;
    listen 80;

    # Kept reachable on port 80 for renewals. The redirect is scoped to
    # location / so it cannot short-circuit the challenge above.
    include /etc/nginx/snippets/acme-challenge.conf;

    location / { return 301 https://beatscript.app$request_uri; }
}

server {
    server_name btw.bitwrap.io;
    listen 443 ssl;

    ssl_certificate     /etc/letsencrypt/live/btw.bitwrap.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/btw.bitwrap.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/blocklist-tencent.conf;
    include /etc/nginx/blocklist-byteplus.conf;
    include /etc/nginx/blocklist-botcheck.conf;

    # The JSON-LD @context (https://btw.bitwrap.io/context/v1.jsonld) is published as immutable: documents name this URL,
    # so it is served here as it always was, not redirected.
    location /context/ {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://127.0.0.1:18097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Programs are small (<= 16 KB of text); nothing here takes a big body.
    client_max_body_size 64k;

    # Streaming renders: chunked from the first chunk. No buffering either way, no gzip (it is audio),
    # and a long read timeout for a whole song.
    location /api/render/ {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://127.0.0.1:18097;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Server-sent events (the browser <-> MCP bridge) and the MCP endpoint (streamable HTTP).
    location ~ ^/api/session/[^/]+/events$ {
        proxy_pass http://127.0.0.1:18097;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /mcp {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:18097;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Compose calls a model (up to ~3 repair rounds): give it time, and a tighter nginx limit than the app's own.
    location /api/compose {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:18097;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }

    # The admin API (kill switch, stats) is for the host only: the app also refuses it without BTW_ADMIN_TOKEN,
    # but it should not be reachable from the internet at all. From the host:
    #   curl -s -H "Authorization: Bearer $BTW_ADMIN_TOKEN" -X POST -d '{"enabled":false}' http://127.0.0.1:18097/api/admin/compose
    # (or just: touch ~/Workspace/btw-bitwrap-io/data/compose.off).
    location /api/admin/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:18097;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://127.0.0.1:18097;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Everything else (the app, /p/ and /c/ links, cards, docs, llms.txt) moved: a permanent redirect to the same path
    # on beatscript.app. A #fragment link (/#<CID>.<packed>) keeps its fragment: browsers carry it across a redirect.
    location / {
        return 301 https://beatscript.app$request_uri;
    }
}
