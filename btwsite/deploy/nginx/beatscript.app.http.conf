# beatscript.app (apex only), stage 1 (before the certificate exists): port 80 only. Serves the ACME http-01
# challenge from disk and redirects everything else; nothing is proxied to the app yet.
server {
    server_name beatscript.app;
    listen 80;
    include /etc/nginx/snippets/acme-challenge.conf;
    location / { return 301 https://$host$request_uri; }
}
