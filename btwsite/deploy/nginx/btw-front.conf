# btw_front: which server answers beatscript.app and btw.bitwrap.io. Installed as /etc/nginx/conf.d/btw-front.conf
# (deploy.sh upstream, only when missing). It is btwserve (Rust, the btw-rust service) on 127.0.0.1:18099; the Go
# btwsite server that used to be on 127.0.0.1:18097 is retired, so there is nothing to roll back to.
upstream btw_front {
    server 127.0.0.1:18099;
    keepalive 16;
}
