# beatscript.app (+ www): the new home of the btw app, proxied to the SAME backend as btw.bitwrap.io
# (127.0.0.1:18097, one process, no second instance). Derived from btw.bitwrap.io.conf; keep the two in step.
# .app is on the HSTS preload list, so browsers refuse plain http: port 80 exists only for ACME + redirect.
# The server's -public-url is still https://btw.bitwrap.io; flipping it to https://beatscript.app is a separate step
# (see btwsite/deploy/deploy.sh, "public-url"). One certificate covers the apex (no www) (deploy.sh cert-beatscript).
server {
    server_name beatscript.app;
    listen 80;

    # Kept reachable on port 80 for renewals. The redirect is scoped to
    # location / so it cannot short-circuit the challenge above.
    include /etc/nginx/snippets/acme-challenge.conf;

    location / { return 301 https://$host$request_uri; }
}

server {
    server_name beatscript.app;
    listen 443 ssl;

    ssl_certificate     /etc/letsencrypt/live/beatscript.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beatscript.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/blocklist-tencent.conf;
    include /etc/nginx/blocklist-byteplus.conf;
    include /etc/nginx/blocklist-botcheck.conf;

    # Programs are small (<= 16 KB of text); nothing here takes a big body.
    client_max_body_size 64k;

    # Streaming renders: chunked from the first chunk. No buffering either way, no gzip (it is audio),
    # and a long read timeout for a whole song.
    location /api/render/ {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://127.0.0.1:18097;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Server-sent events (the browser <-> MCP bridge) and the MCP endpoint (streamable HTTP).
    location ~ ^/api/session/[^/]+/events$ {
        proxy_pass http://127.0.0.1:18097;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /mcp {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:18097;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Compose calls a model (up to ~3 repair rounds): give it time, and a tighter nginx limit than the app's own.
    location /api/compose {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:18097;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }

    # The admin API (kill switch, stats) is for the host only: the app also refuses it without BTW_ADMIN_TOKEN,
    # but it should not be reachable from the internet at all. From the host:
    #   curl -s -H "Authorization: Bearer $BTW_ADMIN_TOKEN" -X POST -d '{"enabled":false}' http://127.0.0.1:18097/api/admin/compose
    # (or just: touch ~/Workspace/btw-bitwrap-io/data/compose.off).
    location /api/admin/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:18097;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://127.0.0.1:18097;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Static modules, wasm and styles: the page loads a dozen at once and revalidates (ETag) on every visit.
    # Compression: the wasm comes precompressed from the app (btw_bg.wasm.br/.gz, Content-Encoding set; nginx
    # never re-encodes an encoded response). Everything else textual is gzipped here: proxied responses are not
    # compressed unless gzip_proxied says so, and the default gzip_types is text/html only.
    location ~* \.(?:js|mjs|css|svg|png|ico|json|wasm|webmanifest|woff2?)$ {
        limit_req zone=general burst=200 nodelay;
        gzip on;
        gzip_proxied any;
        gzip_vary on;
        gzip_comp_level 6;
        gzip_min_length 1024;
        gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json application/wasm;
        proxy_pass http://127.0.0.1:18097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://127.0.0.1:18097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
